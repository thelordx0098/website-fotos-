<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>KameraAbenteuer - Interner Editor</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; padding: 50px; }
        .box { background: #333; padding: 30px; border-radius: 8px; max-width: 600px; margin: 0 auto; }
        input, textarea, select, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: none; }
        button { background: #c99656; color: #000; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Neuen Blogbeitrag verfassen</h2>
        <p><small>Hinweis: Lass diese Datei nur lokal auf deinem PC liegen (nicht mit hochladen).</small></p>
        <label>Titel des Beitrags</label>
        <input type="text" id="title" placeholder="z. B. Meine Safari in Kenia">
        <label>Datum</label>
        <input type="text" id="date" value="01. Juni 2026">
        <label>Wähle ein Vorschaubild</label>
        <select id="img-select">
            <option value="tiger">Tiger</option>
            <option value="cheetahs">Geparden</option>
            <option value="flamingos">Flamingos</option>
            <option value="antelope">Antilopen</option>
        </select>
        <label>Textinhalt</label>
        <textarea id="text" rows="8" placeholder="Schreibe hier deine Erlebnisse..."></textarea>
        <button onclick="savePost()">Beitrag auf Website veröffentlichen</button>
    </div>
    <script>
        function savePost() {
            const title = document.getElementById('title').value;
            const date = document.getElementById('date').value;
            const img = document.getElementById('img-select').value;
            const text = document.getElementById('text').value;
            if(!title || !text) { alert("Bitte Titel und Text ausfüllen!"); return; }
            let posts = JSON.parse(localStorage.getItem('blog_posts')) || [];
            posts.unshift({ title, date, img, text });
            localStorage.setItem('blog_posts', JSON.stringify(posts));
            alert("Erfolgreich hinzugefügt! Wenn du index.html im Browser aktualisierst, siehst du den Beitrag.");
        }
    </script>
</body>
</html>
